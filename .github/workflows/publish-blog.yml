# Takes a blog post from the public mirror to the live site, with nobody at a computer.
#
# The daily blog routine (docs/blog/PLAYBOOK.md) runs in the cloud and can push only to the mirror,
# github.com/ViesulisHaris/ethoslove. Vercel deploys github.com/reasj2/ethoslove. This workflow
# runs on the mirror, where Actions are free, and for each blog/<slug> branch:
#   1. checks it with scripts/blog-guard.mjs from main: only blog files, posts that are plain
#      data, the team's author;
#   2. applies it on top of the live main as one commit, then runs the blog tests and the type
#      check;
#   3. pushes that commit to the live main (Vercel deploys it), makes the mirror's main the same
#      commit, and deletes the branch;
#   4. waits for the post to answer on tryethos.io and tells IndexNow.
#
# It needs one repository secret on the mirror: LIVE_REPO_TOKEN, a token that can push to
# reasj2/ethoslove (docs/blog/PLAYBOOK.md, "How a post goes live"). Without it, steps 1 and 2 run and
# the run fails before publishing, so the branch waits and nothing goes out.
#
# It never runs code from the branch: the guard, the tests and the build tools all come from main,
# and the branch contributes only data files the guard has read. Run it by hand for a waiting
# branch from the Actions tab (Publish blog, Run workflow, the branch name).
name: Publish blog

on:
  workflow_run:
    workflows: ["Blog branch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "The waiting branch, blog/<slug>"
        required: true

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ViesulisHaris/ethoslove' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      LIVE_REPO_TOKEN: ${{ secrets.LIVE_REPO_TOKEN }}
      MIRROR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: A blog branch
        run: |
          [[ "$BRANCH" =~ ^blog/[a-z0-9-]+$ ]] || { echo "::error::Not a blog branch: $BRANCH"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch the post and the live main
        run: |
          git fetch -q origin "refs/heads/$BRANCH:refs/remotes/post"
          if [ -n "$LIVE_REPO_TOKEN" ]; then
            git fetch -q "https://x-access-token:${LIVE_REPO_TOKEN}@github.com/reasj2/ethoslove.git" "refs/heads/main:refs/remotes/live"
          else
            echo "::warning::LIVE_REPO_TOKEN isn't set: checking against the mirror's main, and nothing will be published."
            git update-ref refs/remotes/live origin/main
          fi
          echo "BASE=$(git merge-base refs/remotes/live refs/remotes/post)" >> "$GITHUB_ENV"

      - name: Only blog files, plain data, the team's author
        run: node scripts/blog-guard.mjs "$BASE" refs/remotes/post

      - name: Put the post on top of the live main
        run: |
          git checkout -q -B publish refs/remotes/live
          git diff --binary "$BASE" refs/remotes/post > "$RUNNER_TEMP/post.patch"
          git apply --3way --index "$RUNNER_TEMP/post.patch"
          git log -1 --format=%B refs/remotes/post > "$RUNNER_TEMP/message"
          git -c user.name="Haralds" -c user.email="adulis2014@gmail.com" commit -q -F "$RUNNER_TEMP/message"
          git log -1 --stat --format='%h %an <%ae> %s'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Blog tests and type check
        run: |
          npm ci --no-audit --no-fund
          npx vitest run tests/unit/blog-posts.test.ts tests/unit/messages.test.ts tests/unit/blog-guard.test.ts
          npm run typecheck

      - name: Publish
        run: |
          [ -n "$LIVE_REPO_TOKEN" ] || { echo "::error::The post passed every check, but LIVE_REPO_TOKEN isn't set, so it wasn't published. Add the secret, then run this workflow again for $BRANCH."; exit 1; }
          git push -q "https://x-access-token:${LIVE_REPO_TOKEN}@github.com/reasj2/ethoslove.git" publish:main
          echo "Live repository: $(git rev-parse --short HEAD)"
          git push -q "https://x-access-token:${MIRROR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish:main \
            || echo "::warning::The mirror's main couldn't move to the live main (it has commits the live one hasn't). Push main to both remotes by hand."
          git push -q "https://x-access-token:${MIRROR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$BRANCH"

      - name: Wait for it on tryethos.io, then tell IndexNow
        run: |
          slug="${BRANCH#blog/}"
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://tryethos.io/blog/$slug")" = 200 ] && break
            sleep 30
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://tryethos.io/blog/$slug")
          [ "$code" = 200 ] || { echo "::warning::https://tryethos.io/blog/$slug still answers $code after 15 minutes. Check the Vercel deploy."; exit 0; }
          node scripts/indexnow.mjs "https://tryethos.io/blog/$slug" "https://tryethos.io/es/blog/$slug"
          echo "Live: https://tryethos.io/blog/$slug"
