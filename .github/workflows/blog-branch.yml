# A blog post arrived: the daily blog routine pushed blog/<slug> to the public mirror.
#
# This does nothing and holds no secrets, on purpose. "Publish blog" runs when this finishes
# (`workflow_run`), and a workflow_run always runs the definition on main. A workflow triggered by
# the push itself would run whatever version of itself the branch carried, so a branch could
# rewrite its own publishing. Only the mirror gets blog branches, so this never runs on the live
# repository.
name: Blog branch

on:
  push:
    branches: ["blog/**"]

permissions: {}

jobs:
  arrived:
    if: github.repository == 'ViesulisHaris/ethoslove'
    runs-on: ubuntu-latest
    steps:
      - run: echo "A blog branch arrived; Publish blog takes it from here."
